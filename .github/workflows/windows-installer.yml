name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GSTREAMER_VERSION: "1.24.13"
  QT_VERSION: "6.8.0"

jobs:
  build-windows:
    name: win64-${{ matrix.variant }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - mock
          - atem-sdk
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: "nosudo"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Download GStreamer MSVC packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:GSTREAMER_VERSION
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile gst-runtime.msi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile gst-devel.msi

      - name: Install GStreamer (MSVC runtime + devel)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($msi in @("gst-runtime.msi", "gst-devel.msi")) {
            Write-Host "Installing $msi ..."
            $p = Start-Process -FilePath msiexec.exe -ArgumentList @(
              "/i", $msi, "INSTALLDIR=C:\gstreamer", "/qn", "/norestart"
            ) -Wait -PassThru
            if ($p.ExitCode -notin 0, 3010) {
              throw "msiexec $msi failed with exit $($p.ExitCode)"
            }
          }
          $candidates = @(
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86",
            "C:\gstreamer",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\x86_64"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "include\gstreamer-1.0\gst\gst.h")) {
              $found = $c
              break
            }
          }
          if (-not $found) {
            $hit = Get-ChildItem -Path "C:\gstreamer","C:\Program Files" -Filter gst.h -Recurse -Depth 8 -ErrorAction SilentlyContinue `
              | Where-Object { $_.FullName -match 'include\\gstreamer-1\.0\\gst\\gst\.h' } `
              | Select-Object -First 1
            if ($hit) {
              $found = $hit.Directory.Parent.Parent.Parent.Parent.FullName
            }
          }
          if (-not $found) {
            Get-ChildItem -Path "C:\gstreamer","C:\Program Files\gstreamer" -ErrorAction SilentlyContinue -Recurse -Depth 4 | Select-Object -First 40
            throw "Could not locate GStreamer prefix after MSI install"
          }
          $root = $found -replace '\\','/'
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "GSTREAMER_ROOT=$root"

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set mock ATEM build variant
        if: matrix.variant == 'mock'
        run: echo "ATEM_SDK_VARIANT=mock" >> "$GITHUB_ENV"

      - name: Fetch ATEM SDK (build-time only)
        if: matrix.variant == 'atem-sdk'
        env:
          ATEM_SDK_URL: ${{ secrets.ATEM_SDK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${ATEM_SDK_URL:-}" ]]; then
            echo "ATEM_SDK_URL secret is not set; win64-atem-sdk cannot build." >&2
            exit 1
          fi
          echo "Downloading ATEM SDK zip (secret URL is not logged)..."
          curl -fSL --retry 3 --retry-delay 5 -o atem-sdk.zip "${ATEM_SDK_URL}"
          magic=$(head -c 2 atem-sdk.zip | od -An -tx1 | tr -d ' \n')
          if [[ "${magic}" != "504b" ]]; then
            if head -c 256 atem-sdk.zip | grep -Eqi '<!DOCTYPE|<html'; then
              echo "Downloaded file is HTML, not a ZIP (check Google Drive link uses confirm=t)." >&2
            else
              echo "Downloaded file is not a ZIP (missing PK signature)." >&2
            fi
            exit 1
          fi
          unzip -t atem-sdk.zip >/dev/null
          rm -rf "${RUNNER_TEMP}/atem-sdk"
          mkdir -p "${RUNNER_TEMP}/atem-sdk"
          unzip -q atem-sdk.zip -d "${RUNNER_TEMP}/atem-sdk"
          IDL="$(find "${RUNNER_TEMP}/atem-sdk" -type f -iname 'BMDSwitcherAPI.idl' | head -n1)"
          if [[ -z "${IDL}" ]]; then
            echo "BMDSwitcherAPI.idl not found after unpacking ATEM SDK." >&2
            find "${RUNNER_TEMP}/atem-sdk" -maxdepth 5 -type f | head -30
            exit 1
          fi
          SDK_DIR="${RUNNER_TEMP}/atem-sdk"
          rel="${IDL#${RUNNER_TEMP}/atem-sdk/}"
          echo "Found BMDSwitcherAPI.idl at: ${rel}"
          echo "ATEM_SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ATEM_SDK_VARIANT=atem-sdk" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          set -euo pipefail
          CMAKE_ARGS=(
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=cl
            -DCMAKE_CXX_COMPILER=cl
            -DENABLE_GUI=ON
            -DENABLE_GSTREAMER=ON
            -DBUILD_TESTING=ON
            -DBUILD_WINDOWS_INSTALLER=ON
            "-DCMAKE_INSTALL_PREFIX=${RUNNER_TEMP}/install"
            "-DGSTREAMER_ROOT=${GSTREAMER_ROOT}"
          )
          if [[ -n "${CMAKE_PREFIX_PATH:-}" ]]; then
            CMAKE_ARGS+=("-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}")
          fi
          if [[ -n "${Qt6_DIR:-}" ]]; then
            CMAKE_ARGS+=("-DQt6_DIR=${Qt6_DIR}")
          fi
          if [[ -n "${ATEM_SDK_DIR:-}" ]]; then
            CMAKE_ARGS+=("-DATEM_SDK_DIR=${ATEM_SDK_DIR}")
          fi
          cmake "${CMAKE_ARGS[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Create NSIS installer (CPack)
        run: |
          set -euo pipefail
          cmake --build build --target package || {
            if [[ -f build/_CPack_Packages/win64/NSIS/NSISOutput.log ]]; then
              echo "---- NSISOutput.log ----"
              cat build/_CPack_Packages/win64/NSIS/NSISOutput.log
            fi
            exit 1
          }
          mkdir -p dist
          shopt -s nullglob
          installers=(build/AtemColorAI-*.exe)
          if (( ${#installers[@]} == 0 )); then
            echo "No CPack installer produced" >&2
            if [[ -f build/_CPack_Packages/win64/NSIS/NSISOutput.log ]]; then
              cat build/_CPack_Packages/win64/NSIS/NSISOutput.log
            fi
            exit 1
          fi
          cp -v "${installers[@]}" dist/

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ matrix.variant }}
          path: |
            dist/*.exe
            build/AtemColorAI-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: ${{ matrix.variant == 'mock' }}
          files: |
            dist/*.exe
            build/AtemColorAI-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}