name: Windows installer

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  GSTREAMER_VERSION: "1.24.13"
  QT_VERSION: "6.8.0"

jobs:
  build-windows:
    name: win64-atem-sdk
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          install-deps: "nosudo"
          cache: true

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Cache GStreamer MSVC prefix
        uses: actions/cache@v4
        id: gst-cache
        with:
          path: C:\gstreamer
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-x86_64

      - name: Download GStreamer MSVC packages
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:GSTREAMER_VERSION
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile gst-runtime.msi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$ver.msi" -OutFile gst-devel.msi

      - name: Install GStreamer (MSVC runtime + devel)
        shell: pwsh
        env:
          GST_CACHE_HIT: ${{ steps.gst-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GST_CACHE_HIT -eq 'true' -or (Test-Path 'C:\gstreamer\include\gstreamer-1.0\gst\gst.h')) {
            Write-Host "GStreamer cache hit — skipping MSI install"
          } else {
            foreach ($msi in @("gst-runtime.msi", "gst-devel.msi")) {
              Write-Host "Installing $msi ..."
              $p = Start-Process -FilePath msiexec.exe -ArgumentList @(
                "/i", $msi, "INSTALLDIR=C:\gstreamer", "/qn", "/norestart"
              ) -Wait -PassThru
              if ($p.ExitCode -notin 0, 3010) {
                throw "msiexec $msi failed with exit $($p.ExitCode)"
              }
            }
          }
          $candidates = @(
            "C:\gstreamer\1.0\msvc_x86_64",
            "C:\gstreamer\1.0\msvc_x86",
            "C:\gstreamer",
            "C:\Program Files\gstreamer\1.0\msvc_x86_64",
            "C:\Program Files\gstreamer\1.0\x86_64"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path (Join-Path $c "include\gstreamer-1.0\gst\gst.h")) {
              $found = $c
              break
            }
          }
          if (-not $found) {
            $hit = Get-ChildItem -Path "C:\gstreamer","C:\Program Files" -Filter gst.h -Recurse -Depth 8 -ErrorAction SilentlyContinue `
              | Where-Object { $_.FullName -match 'include\\gstreamer-1\.0\\gst\\gst\.h' } `
              | Select-Object -First 1
            if ($hit) {
              $found = $hit.Directory.Parent.Parent.Parent.Parent.FullName
            }
          }
          if (-not $found) {
            Get-ChildItem -Path "C:\gstreamer","C:\Program Files\gstreamer" -ErrorAction SilentlyContinue -Recurse -Depth 4 | Select-Object -First 40
            throw "Could not locate GStreamer prefix after MSI install"
          }
          $root = $found -replace '\\','/'
          "GSTREAMER_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "GSTREAMER_ROOT=$root"

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache unpacked ATEM SDK
        uses: actions/cache@v4
        id: atem-sdk-cache
        with:
          path: ${{ runner.temp }}/atem-sdk
          key: atem-sdk-unpacked-v1

      - name: Fetch ATEM SDK (build-time only)
        env:
          ATEM_SDK_URL: ${{ secrets.ATEM_SDK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${ATEM_SDK_URL:-}" ]]; then
            echo "ATEM_SDK_URL secret is not set; CI requires ATEM SDK." >&2
            exit 1
          fi
          SDK_DIR="${RUNNER_TEMP}/atem-sdk"
          if [[ -f "${SDK_DIR}/BMDSwitcherAPI.idl" ]] || find "${SDK_DIR}" -type f -iname 'BMDSwitcherAPI.idl' 2>/dev/null | grep -q .; then
            echo "ATEM SDK cache hit — skipping download"
            echo "ATEM_SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
            echo "ATEM_SDK_VARIANT=atem-sdk" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Downloading ATEM SDK zip (secret URL is not logged)..."
          curl -fSL --retry 3 --retry-delay 5 -o atem-sdk.zip "${ATEM_SDK_URL}"
          magic=$(head -c 2 atem-sdk.zip | od -An -tx1 | tr -d ' \n')
          if [[ "${magic}" != "504b" ]]; then
            if head -c 256 atem-sdk.zip | grep -Eqi '<!DOCTYPE|<html'; then
              echo "Downloaded file is HTML, not a ZIP (check Google Drive link uses confirm=t)." >&2
            else
              echo "Downloaded file is not a ZIP (missing PK signature)." >&2
            fi
            exit 1
          fi
          unzip -t atem-sdk.zip >/dev/null
          rm -rf "${SDK_DIR}"
          mkdir -p "${SDK_DIR}"
          unzip -q atem-sdk.zip -d "${SDK_DIR}"
          IDL="$(find "${SDK_DIR}" -type f -iname 'BMDSwitcherAPI.idl' | head -n1)"
          if [[ -z "${IDL}" ]]; then
            echo "BMDSwitcherAPI.idl not found after unpacking ATEM SDK." >&2
            find "${SDK_DIR}" -maxdepth 5 -type f | head -30
            exit 1
          fi
          rel="${IDL#${SDK_DIR}/}"
          echo "Found BMDSwitcherAPI.idl at: ${rel}"
          echo "ATEM_SDK_DIR=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ATEM_SDK_VARIANT=atem-sdk" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          set -euo pipefail
          CMAKE_ARGS=(
            -B build
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=cl
            -DCMAKE_CXX_COMPILER=cl
            -DENABLE_GUI=ON
            -DENABLE_GSTREAMER=ON
            -DBUILD_TESTING=ON
            -DBUILD_WINDOWS_INSTALLER=ON
            "-DCMAKE_INSTALL_PREFIX=${RUNNER_TEMP}/install"
            "-DGSTREAMER_ROOT=${GSTREAMER_ROOT}"
          )
          if [[ -n "${CMAKE_PREFIX_PATH:-}" ]]; then
            CMAKE_ARGS+=("-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}")
          fi
          if [[ -n "${Qt6_DIR:-}" ]]; then
            CMAKE_ARGS+=("-DQt6_DIR=${Qt6_DIR}")
          fi
          if [[ -n "${ATEM_SDK_DIR:-}" ]]; then
            CMAKE_ARGS+=("-DATEM_SDK_DIR=${ATEM_SDK_DIR}")
          fi
          cmake "${CMAKE_ARGS[@]}"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Create NSIS installer (CPack)
        run: |
          set -euo pipefail
          cmake --build build --target package || {
            if [[ -f build/_CPack_Packages/win64/NSIS/NSISOutput.log ]]; then
              echo "---- NSISOutput.log ----"
              cat build/_CPack_Packages/win64/NSIS/NSISOutput.log
            fi
            exit 1
          }
          mkdir -p dist
          shopt -s nullglob
          installers=(build/AtemColorAI-*.exe)
          if (( ${#installers[@]} == 0 )); then
            echo "No CPack installer produced" >&2
            if [[ -f build/_CPack_Packages/win64/NSIS/NSISOutput.log ]]; then
              cat build/_CPack_Packages/win64/NSIS/NSISOutput.log
            fi
            exit 1
          fi
          cp -v "${installers[@]}" dist/
          if ! ls dist/*win64-atem-sdk.exe >/dev/null 2>&1; then
            echo "Expected win64-atem-sdk installer artifact" >&2
            ls -la dist/
            exit 1
          fi

      - name: Verify NSIS shortcut targets
        run: |
          set -euo pipefail
          nsi="build/_CPack_Packages/win64/NSIS/project.nsi"
          if [[ ! -f "$nsi" ]]; then
            echo "Missing $nsi" >&2
            exit 1
          fi
          grep -Fq 'atem-color-ai.exe' "$nsi"
          grep -Fq 'SMPROGRAMS' "$nsi"
          grep -Fq '$DESKTOP' "$nsi"
          grep -Fq 'Atem Color AI.lnk' "$nsi"

      - name: Smoke test installer (bundled GStreamer, no GStreamer on PATH)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem -Path dist -Filter 'AtemColorAI-*-win64-atem-sdk.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'Installer not found in dist/' }
          $installDir = Join-Path $env:RUNNER_TEMP 'atem-smoke-install'
          if (Test-Path $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $proc = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Silent install failed with exit $($proc.ExitCode)"
          }
          $exeDir = Join-Path $installDir 'bin'
          $exe = Join-Path $exeDir 'atem-color-ai.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Installed binary missing: $exe"
          }
          foreach ($dll in @('gstreamer-1.0-0.dll', 'gstapp-1.0-0.dll', 'glib-2.0-0.dll', 'gobject-2.0-0.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $exeDir $dll))) {
              throw "Missing bundled DLL in bin/: $dll"
            }
          }
          $pluginsDir = Join-Path $installDir 'lib\gstreamer-1.0'
          if (-not (Test-Path -LiteralPath $pluginsDir)) {
            throw "Missing plugins dir: $pluginsDir"
          }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item env:GSTREAMER_ROOT -ErrorAction SilentlyContinue
          Remove-Item env:GST_PLUGIN_PATH -ErrorAction SilentlyContinue
          $run = Start-Process -FilePath $exe -ArgumentList @('--help') -Wait -PassThru -NoNewWindow
          if ($run.ExitCode -ne 0) {
            throw "atem-color-ai --help failed with exit $($run.ExitCode)"
          }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-atem-sdk
          path: |
            dist/*.exe
            build/AtemColorAI-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.exe
            build/AtemColorAI-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}